<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENON MART | Luxury Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --silver: #C0C0C0; --bg-dark: #050505; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; overflow-x: hidden; }
        .font-sync { font-family: 'Syncopate', sans-serif; }
        .gold-gradient { background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-bg { background: linear-gradient(45deg, #BF953F, #AA771C); }
        .glass-card { background: #0a0a0a; border: 1px solid rgba(191, 149, 63, 0.3); transition: 0.5s; }
        .logo-glow { border-radius: 50%; box-shadow: 0 0 20px rgba(191, 149, 63, 0.3); border: 2px solid #BF953F; }
        
        /* Fixed Solid Dropdown */
        .dropdown-content { display: none; position: absolute; right: 0; top: 60px; background: #000000; min-width: 200px; border: 2px solid #BF953F; border-radius: 15px; z-index: 1000 !important; box-shadow: 0 10px 30px rgba(0,0,0,1); }
        .dropdown-content.show { display: block; animation: fadeIn 0.2s ease; }
        
        /* Solid Admin Panel */
        #admin-panel { background-color: #000000 !important; z-index: 9999 !important; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="login-page" class="h-screen flex flex-col items-center justify-center text-center p-6 bg-black">
        <div class="max-w-md w-full p-10 rounded-[3rem] glass-card">
            <img src="https://i.ibb.co/845TLnf5/xenon-mart-logo.png" class="w-40 h-40 mx-auto mb-8 logo-glow object-cover">
            <h1 class="text-3xl font-sync font-bold mb-2 gold-gradient">XENON MART</h1>
            <p class="text-gray-500 tracking-[0.4em] text-[10px] mb-10 uppercase italic">Shop Smart • Live Better</p>
            <button onclick="login()" class="w-full gold-bg text-black font-bold py-4 rounded-2xl shadow-xl hover:brightness-110 transition-all flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                Sign In With Google
            </button>
        </div>
    </div>

    <!-- MAIN WEBSITE -->
    <div id="main-content" class="hidden">
        <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center bg-black border-b border-gold/20 shadow-2xl">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/845TLnf5/xenon-mart-logo.png" class="w-9 h-9 rounded-full object-cover border border-gold">
                <span class="font-sync font-bold gold-gradient text-lg">XENON MART</span>
            </div>
            
            <div class="relative flex items-center gap-4">
                <button id="admin-btn" onclick="openAdmin()" class="hidden text-[9px] border border-gold text-gold px-3 py-1 rounded-full font-bold uppercase">Admin</button>
                <img id="user-img" src="" class="w-9 h-9 rounded-full border border-gold/30">
                <button onclick="toggleMenu()" class="p-2">
                    <svg class="w-6 h-6 text-gold" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>

                <div id="dropdown-menu" class="dropdown-content">
                    <a href="https://instagram.com/xenonmart9" target="_blank" class="block px-4 py-3 hover:bg-gold/20 text-sm border-b border-gold/20 font-semibold text-gold">Instagram</a>
                    <div class="px-4 py-3 text-[10px] text-gray-500 border-b border-gold/20 uppercase tracking-widest">Version 1.0.5</div>
                    <button onclick="logout()" class="w-full text-left px-4 py-3 text-red-500 hover:bg-red-500/10 text-sm font-bold">Logout</button>
                </div>
            </div>
        </nav>

        <header class="pt-44 pb-20 text-center px-6">
            <h2 class="text-5xl md:text-7xl font-sync font-bold mb-6 leading-tight uppercase tracking-tighter">Luxury <span class="gold-gradient">Bundles</span></h2>
            <div class="w-16 h-1 gold-bg mx-auto mb-8 rounded-full"></div>
        </header>

        <section id="product-list" class="container mx-auto px-6 pb-32 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></section>

        <!-- SOLID ADMIN PANEL OVERLAY -->
        <div id="admin-panel" class="hidden fixed inset-0 bg-black p-6 overflow-y-auto">
            <div class="max-w-5xl mx-auto py-10">
                <div class="flex justify-between items-center mb-10 border-b border-gold/30 pb-6">
                    <h3 class="text-2xl font-sync gold-gradient uppercase tracking-tighter">Inventory Control</h3>
                    <button onclick="closeAdmin()" class="text-white text-5xl">&times;</button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="bg-[#0a0a0a] border border-gold/30 p-8 rounded-[2rem] shadow-2xl">
                        <h4 id="form-title" class="text-xs font-bold mb-6 text-gold uppercase tracking-[0.3em]">Add New Bundle</h4>
                        <div class="space-y-4">
                            <input type="hidden" id="editing-id">
                            <input type="text" id="p-title" placeholder="Bundle Name" class="w-full bg-black border border-white/20 p-3 rounded-xl text-sm outline-none focus:border-gold">
                            <textarea id="p-desc" placeholder="Details & Description" class="w-full bg-black border border-white/20 p-3 rounded-xl text-sm outline-none h-32 focus:border-gold"></textarea>
                            <input type="number" id="p-price" placeholder="Price (INR)" class="w-full bg-black border border-white/20 p-3 rounded-xl text-sm outline-none focus:border-gold">
                            <input type="text" id="p-image" placeholder="Image DIRECT Link (.jpg/.png)" class="w-full bg-black border border-white/20 p-3 rounded-xl text-sm outline-none focus:border-gold">
                            <input type="text" id="p-link" placeholder="Cosmofeed Payment Link" class="w-full bg-black border border-white/20 p-3 rounded-xl text-sm outline-none focus:border-gold">
                            <button id="submit-btn" onclick="saveProduct()" class="w-full gold-bg text-black font-bold py-4 rounded-xl uppercase tracking-widest shadow-xl">Publish to Store</button>
                            <button id="cancel-edit" onclick="resetForm()" class="hidden w-full text-gray-500 text-xs uppercase tracking-widest mt-2">Cancel Edit</button>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold mb-6 uppercase text-gray-500 tracking-widest italic">Live Inventory</h4>
                        <div id="admin-product-list" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="py-16 text-center border-t border-white/5 bg-black">
            <img src="https://i.ibb.co/845TLnf5/xenon-mart-logo.png" class="w-12 h-12 mx-auto mb-4 rounded-full opacity-40">
            <p class="text-gray-500 text-[10px] tracking-widest mb-4">Instagram: @xenonmart9</p>
            <p class="text-[8px] text-gray-700 font-sync tracking-[0.5em] uppercase">© 2024 XENON MART</p>
        </footer>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPMYrUQ9FxVY9wzl6eu_fKM15l0u4GWFw",
            authDomain: "xenon-mart.firebaseapp.com",
            projectId: "xenon-mart",
            storageBucket: "xenon-mart.firebasestorage.app",
            messagingSenderId: "969095850772",
            appId: "1:969095850772:web:cc1d020a0534edc600f001",
            measurementId: "G-120GGYSLL0"
        };

        const adminEmail = "zidanraj65@gmail.com"; 
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function toggleMenu() { document.getElementById('dropdown-menu').classList.toggle('show'); }
        async function login() { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('user-img').src = user.photoURL;
                if(user.email === adminEmail) document.getElementById('admin-btn').classList.remove('hidden');
                loadProducts();
            }
        });

        function openAdmin() { document.getElementById('admin-panel').classList.remove('hidden'); loadAdminItems(); }
        function closeAdmin() { document.getElementById('admin-panel').classList.add('hidden'); resetForm(); }

        async function saveProduct() {
            const id = document.getElementById('editing-id').value;
            const data = {
                title: document.getElementById('p-title').value,
                desc: document.getElementById('p-desc').value,
                price: document.getElementById('p-price').value,
                image: document.getElementById('p-image').value,
                link: document.getElementById('p-link').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if(!data.title || !data.price || !data.link) return alert("Fill required fields!");
            if(id) { await db.collection('bundles').doc(id).update(data); } 
            else { data.createdAt = data.updatedAt; await db.collection('bundles').add(data); }
            resetForm(); loadAdminItems(); loadProducts();
        }

        async function loadProducts() {
            const snap = await db.collection('bundles').orderBy('updatedAt', 'desc').get();
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `
                    <div class="bg-[#0a0a0a] border border-gold/20 rounded-[3rem] overflow-hidden">
                        <div class="relative h-72">
                            <img src="${p.image}" onerror="this.src='https://via.placeholder.com/600x400/000000/BF953F?text=XENON+MART'" class="w-full h-full object-cover">
                            <div class="absolute bottom-6 left-6 bg-gold text-black px-4 py-1 rounded-full font-bold text-[10px] font-sync">INR ${p.price}</div>
                        </div>
                        <div class="p-8">
                            <h4 class="text-lg font-sync font-bold mb-4 uppercase text-white">${p.title}</h4>
                            <p class="text-gray-500 text-[9px] mb-8 leading-relaxed uppercase tracking-widest line-clamp-3">${p.desc}</p>
                            <a href="${p.link}" target="_blank" class="block w-full text-center border border-gold/30 text-gold py-4 rounded-2xl font-bold hover:bg-gold hover:text-black transition-all uppercase tracking-[0.3em] text-[10px]">Buy Now</a>
                        </div>
                    </div>`;
            });
        }

        async function loadAdminItems() {
            const snap = await db.collection('bundles').get();
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `
                    <div class="bg-[#111] p-4 rounded-2xl flex justify-between items-center border border-white/10">
                        <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">${p.title}</span>
                        <div class="flex gap-2">
                            <button onclick="editForm('${doc.id}', '${p.title}', \`${p.desc}\`, '${p.price}', '${p.image}', '${p.link}')" class="text-gold text-[9px] font-bold border border-gold/40 px-3 py-1 rounded-lg bg-black">EDIT</button>
                            <button onclick="deleteP('${doc.id}')" class="text-red-500 text-[9px] font-bold border border-red-500/40 px-3 py-1 rounded-lg bg-black">DEL</button>
                        </div>
                    </div>`;
            });
        }

        function editForm(id, title, desc, price, image, link) {
            document.getElementById('editing-id').value = id;
            document.getElementById('p-title').value = title;
            document.getElementById('p-desc').value = desc;
            document.getElementById('p-price').value = price;
            document.getElementById('p-image').value = image;
            document.getElementById('p-link').value = link;
            document.getElementById('form-title').innerText = "Edit Inventory";
            document.getElementById('submit-btn').innerText = "Update Listing";
            document.getElementById('cancel-edit').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('editing-id').value = "";
            document.getElementById('p-title').value = "";
            document.getElementById('p-desc').value = "";
            document.getElementById('p-price').value = "";
            document.getElementById('p-image').value = "";
            document.getElementById('p-link').value = "";
            document.getElementById('form-title').innerText = "Add New Bundle";
            document.getElementById('submit-btn').innerText = "Publish to Store";
            document.getElementById('cancel-edit').classList.add('hidden');
        }

        async function deleteP(id) { if(confirm("Delete item?")) { await db.collection('bundles').doc(id).delete(); loadAdminItems(); loadProducts(); } }
        window.onclick = function(event) { if (!event.target.closest('.relative')) { document.getElementById('dropdown-menu').classList.remove('show'); } }
    </script>
</body>
</html>
